version: '3.8'

services:
  # Frontend em modo de desenvolvimento
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "4201:4200"  # Alterado para usar a porta 4201 no host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm start -- --host 0.0.0.0
    environment:
      - NODE_ENV=development
    networks:
      - osiris-network

  # Banco de dados PostgreSQL
  db:
    image: postgres:15-alpine
    ports:
      - "5433:5432"  # Alterado para usar a porta 5433 no host
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=osiris
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    networks:
      - osiris-network

networks:
  osiris-network:
    driver: bridge

volumes:
  postgres_data: