version: '3.8'

services:
  # Frontend - Aplicação Angular
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - osiris-network
    environment:
      - NODE_ENV=development

  # Backend - API Spring Boot (comentado até estar pronto)
  backend:
    image: eclipse-temurin:17-jdk-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    command: echo "Backend ainda não implementado"
    # command: ./mvnw spring-boot:run
    networks:
      - osiris-network
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/osiris
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      - db

  # Banco de dados PostgreSQL
  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=osiris
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    networks:
      - osiris-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  osiris-network:
    driver: bridge

volumes:
  postgres_data: