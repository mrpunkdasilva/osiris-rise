<div class="forgot-password-container">
  <h2 class="form-title">Recuperar Senha</h2>

  <p class="form-description">
    Digite seu email abaixo e enviaremos instruções para redefinir sua senha.
  </p>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <div *ngIf="successMessage" class="success-message">
    {{ successMessage }}
  </div>

  <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        placeholder="Seu email"
        [class.is-invalid]="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched"
      >
      <div class="validation-error" *ngIf="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched">
        <span *ngIf="forgotPasswordForm.get('email')?.errors?.['required']">Email é obrigatório</span>
        <span *ngIf="forgotPasswordForm.get('email')?.errors?.['email']">Email inválido</span>
      </div>
    </div>

    <button
      type="submit"
      class="btn-submit"
      [disabled]="forgotPasswordForm.invalid || isLoading"
    >
      <span *ngIf="!isLoading">Enviar Instruções</span>
      <app-loading-spinner *ngIf="isLoading" [size]="'small'" [color]="'white'"></app-loading-spinner>
    </button>
  </form>

  <div class="back-to-login">
    <a routerLink="/auth/login">Voltar para o login</a>
  </div>
</div>
