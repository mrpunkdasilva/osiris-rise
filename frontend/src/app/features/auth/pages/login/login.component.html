<div class="login-container">
  <h2 class="form-title">Login</h2>
  
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>
  
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">Email</label>
      <input 
        type="email" 
        id="email" 
        formControlName="email" 
        placeholder="Seu email"
        [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
      >
      <div class="validation-error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
        <span *ngIf="loginForm.get('email')?.errors?.['required']">Email é obrigatório</span>
        <span *ngIf="loginForm.get('email')?.errors?.['email']">Email inválido</span>
      </div>
    </div>
    
    <div class="form-group">
      <label for="password">Senha</label>
      <input 
        type="password" 
        id="password" 
        formControlName="password"
        placeholder="Sua senha"
        [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
      >
      <div class="validation-error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        <span *ngIf="loginForm.get('password')?.errors?.['required']">Senha é obrigatória</span>
        <span *ngIf="loginForm.get('password')?.errors?.['minlength']">Senha deve ter pelo menos 6 caracteres</span>
      </div>
    </div>
    
    <div class="form-group remember-me">
      <label class="checkbox-container">
        <input type="checkbox" formControlName="rememberMe">
        <span class="checkmark"></span>
        Lembrar-me
      </label>
      <a routerLink="/auth/forgot-password" class="forgot-password">Esqueceu a senha?</a>
    </div>
    
    <button 
      type="submit" 
      class="btn-login" 
      [disabled]="loginForm.invalid || isLoading"
    >
      <span *ngIf="!isLoading">Entrar</span>
      <app-loading-spinner *ngIf="isLoading" [size]="'small'" [color]="'white'"></app-loading-spinner>
    </button>
  </form>
  
  <div class="divider">
    <span>ou</span>
  </div>
  
  <div class="social-login">
    <button type="button" class="btn-social btn-google">
      <i class="icon-google"></i> Entrar com Google
    </button>
    <button type="button" class="btn-social btn-apple">
      <i class="icon-apple"></i> Entrar com Apple
    </button>
  </div>
  
  <div class="register-link">
    Não tem uma conta? <a routerLink="/auth/register">Registre-se</a>
  </div>
</div>
