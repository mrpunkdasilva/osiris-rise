<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Definições avançadas -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="50%" stop-color="#d35400" />
      <stop offset="100%" stop-color="#c0392b" />
    </linearGradient>

    <linearGradient id="sunriseGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFA000" />
      <stop offset="50%" stop-color="#FFB74D" />
      <stop offset="100%" stop-color="#FFC107" />
    </linearGradient>

    <linearGradient id="ankhGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="50%" stop-color="#FFECB3" />
      <stop offset="100%" stop-color="#FFD54F" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="hieroglyphPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M5,10 L15,10 M10,5 L10,15" stroke="#FFC107" stroke-width="1" opacity="0.6" />
      <path d="M3,3 L7,7 M13,3 L17,7 M3,17 L7,13 M13,17 L17,13" stroke="#FFC107" stroke-width="0.5" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Círculo de fundo com gradiente -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" />

  <!-- Padrão hieroglífico sutil no fundo -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#hieroglyphPattern)" stroke-width="20" opacity="0.15" />

  <!-- Anel externo com brilho -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#FFC107" stroke-width="5" filter="url(#glow)" />

  <!-- Anel secundário -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#e74c3c" stroke-width="1" stroke-dasharray="1,10" opacity="0.6" />

  <!-- Símbolo Ankh estilizado com gradiente e brilho -->
  <path d="M100 40 C100 40, 80 40, 80 60 C80 80, 100 90, 100 110 L100 150"
        fill="none" stroke="url(#ankhGradient)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="100" cy="60" r="20" fill="none" stroke="url(#ankhGradient)" stroke-width="8" filter="url(#glow)" />

  <!-- Raios de sol nascente com gradiente e brilho -->
  <path d="M60 130 C60 130, 100 90, 140 130"
        fill="none" stroke="url(#sunriseGradient)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />

  <!-- Pequenos pontos de luz como estrelas -->
  <circle cx="70" cy="70" r="2" fill="#FFFFFF" opacity="0.8" />
  <circle cx="130" cy="70" r="2" fill="#FFFFFF" opacity="0.8" />
  <circle cx="50" cy="100" r="1.5" fill="#FFFFFF" opacity="0.6" />
  <circle cx="150" cy="100" r="1.5" fill="#FFFFFF" opacity="0.6" />
  <circle cx="60" cy="50" r="1.5" fill="#FFFFFF" opacity="0.7" />
  <circle cx="140" cy="50" r="1.5" fill="#FFFFFF" opacity="0.7" />
</svg>
