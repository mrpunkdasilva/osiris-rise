<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Definições -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c0392b" />
    </linearGradient>
    <linearGradient id="sunriseGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#FFC107" />
    </linearGradient>
  </defs>

  <!-- Círculo de fundo -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" />

  <!-- Anel externo -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#FFC107" stroke-width="5" />

  <!-- Símbolo Ankh -->
  <path d="M100 40 C100 40, 80 40, 80 60 C80 80, 100 90, 100 110 L100 150"
        fill="none" stroke="#FFD54F" stroke-width="8" stroke-linecap="round" />
  <circle cx="100" cy="60" r="20" fill="none" stroke="#FFD54F" stroke-width="8" />

  <!-- Raios de sol nascente -->
  <path d="M60 130 C60 130, 100 90, 140 130"
        fill="none" stroke="url(#sunriseGradient)" stroke-width="8" stroke-linecap="round" />
</svg>