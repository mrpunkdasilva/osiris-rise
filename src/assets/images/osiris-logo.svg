<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Fundo circular com gradiente -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A237E" />
      <stop offset="100%" stop-color="#4A148C" />
    </linearGradient>
    <linearGradient id="sunriseGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#FFEB3B" />
    </linearGradient>
  </defs>

  <!-- Círculo de fundo -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" />

  <!-- Anel externo (estilo egípcio) -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#FFC107" stroke-width="5" />

  <!-- Símbolo Ankh (símbolo egípcio da vida) estilizado -->
  <path d="M100 40 C100 40, 80 40, 80 60 C80 80, 100 90, 100 110 L100 150"
        fill="none" stroke="#E1BEE7" stroke-width="8" stroke-linecap="round" />
  <circle cx="100" cy="60" r="20" fill="none" stroke="#E1BEE7" stroke-width="8" />

  <!-- Raios de sol nascente (simbolizando renascimento) -->
  <path d="M60 130 C60 130, 100 90, 140 130"
        fill="none" stroke="url(#sunriseGradient)" stroke-width="8" stroke-linecap="round" />

  <!-- Estrelas (simbolizando aspiração e crescimento) -->
  <circle cx="70" cy="70" r="3" fill="#FFFFFF" />
  <circle cx="130" cy="70" r="3" fill="#FFFFFF" />
  <circle cx="50" cy="100" r="2" fill="#FFFFFF" />
  <circle cx="150" cy="100" r="2" fill="#FFFFFF" />
  <circle cx="60" cy="50" r="2" fill="#FFFFFF" />
  <circle cx="140" cy="50" r="2" fill="#FFFFFF" />
</svg>
